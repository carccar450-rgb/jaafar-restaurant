function calc(i, q) {
    if (q === 0) return 0;
    return q * items[i].p;
}

function start() {
    let h = ""; let lastS = "";
    items.forEach((it, i) => {
        if (it.s !== lastS) { h += '<div class="st">' + it.s + '</div>'; lastS = it.s; }
        let q = cart[i] || 0;
        let txt = L[it.t][q];
        let pr = (q === 0) ? it.p : calc(i, q);
        h += '<div class="row"><span class="item-name">'+it.n+'</span><div class="ctrl"><button class="btn bp" onclick="up('+i+',1)">+</button><div class="disp"><span class="wt">'+txt+'</span><span class="pt">'+pr.toLocaleString()+' د.ع</span></div><button class="btn bm" onclick="up('+i+',-1)">-</button></div></div>';
    });
    document.getElementById('m-body').innerHTML = h;
    update();
}

function up(i, v) { if ( (cart[i]||0)+v >= 0 && (cart[i]||0)+v < L[items[i].t].length) { cart[i] = (cart[i]||0)+v; start(); } }

function update() {
    let t = 0; let list = [];
    items.forEach((it, i) => { if (cart[i] > 0) { t += calc(i, cart[i]); list.push(it.n + " (" + L[it.t][cart[i]] + ")"); } });
    document.getElementById('final-total').innerText = t.toLocaleString();
    document.getElementById('cart-text').innerText = list.length ? list.join(" | ") : "قائمة الطلبات: فارغة";
}

function sendWA() {
    let n = document.getElementById('c-name').value, a = document.getElementById('c-addr').value, nt = document.getElementById('c-note').value;

    window.open("https://wa.me/9647750009420?text=" + encodeURIComponent(msg + "\n💰 المجموع: " + document.getElementById('final-total').innerText + " د.ع"));
